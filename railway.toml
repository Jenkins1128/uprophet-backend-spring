[build]
builder = "NIXPACKS"
buildCommand = "./mvnw -B -DskipTests package"

[build.nixpacksPlan.variables]
NIXPACKS_JDK_VERSION = "17"

[deploy]
startCommand = "java -XX:MaxRAMPercentage=75.0 -jar target/uprophet-backend-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
