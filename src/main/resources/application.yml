server:
  port: "${PORT:3001}"

spring:
  config:
    # application-local.yml overrides this file unless the prod profile is active.
    import: optional:classpath:application-local.yml
  datasource:
    url: "jdbc:mysql://${MYSQLHOST:${HOST:localhost}}:${MYSQLPORT:3306}/${MYSQLDATABASE:${DATABASE_DEV:uprophet}}?serverTimezone=UTC"
    username: "${MYSQLUSER:${USER_DEV:}}"
    password: "${MYSQLPASSWORD:${PASSWORD_DEV:}}"
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

app:
  resend:
    api-key: "${RESEND_API_KEY:}"
  cors:
    allowed-origins: "${ALLOWED_ORIGINS:http://localhost:3000,https://uprophet.com}"
  jwt:
    access-token-secret: "${ACCESS_TOKEN_SECRET:}"
    access-token-life: "${ACCESS_TOKEN_LIFE:1h}"
    refresh-token-secret: "${REFRESH_TOKEN_SECRET:}"
    refresh-token-life: "${REFRESH_TOKEN_LIFE:7d}"
  password:
    site-key: "${SITE_KEY:}"
    nonce-salt: "${NONCE_SALT:}"
